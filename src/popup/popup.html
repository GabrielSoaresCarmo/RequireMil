<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="./popup.css">
</head>
    <body class="max-w-xl w-128 h-128">
        <img src="../assets/requireml.png" alt=" " class="w-screen h-24">
        <form id="form-docs" class="max-w-md mx-auto p-6 bg-slate-100 shadow rounded flex flex-col gap-6 items-center">
            <label class="border-1">
                <span class="font-bold">Requerimento:</span>
                <select id="tipo-requerimento" class="border-1 rounded">
                    <option value="vazio" class="text-center">Selecione</option>
                    <option value="arrimo" class="text-center">Arrimo de família</option>
                    <option value="isenção-servico" class="text-center">Isenção do serviço militar </option>
                    <option value="isenção-txmt" class="text-center">Isenção de taxas e multas</option>
                    <option value="maior-30" class="text-center">Maior de 30 anos</option>
                    <option value="retificacao-dados-cadastrais" class="text-center">Retificação de dados cadastrais</option>
                </select>
            </label>
            <fieldset id="copias-docs" class="flex flex-col items-start w-full hidden" disabled>
                <legend class="mx-auto p-4 shadow">Documentos copiados que serão anexados ao requerimento</legend>
                <label>
                    <input class="certidao-alistado" type="checkbox" name="tipo-certidao-alistado" value="certidao-de-nascimento" checked>
                    <span>Certidão de nascimento</span>
                </label>
                <label class="hidden">
                    <input class="certidao-alistado" type="radio" name="tipo-certidao-alistado" value="certidao-de-casamento" checked>
                    <span>Certidão de casamento</span>
                </label>
                <label class="">
                    <input type="checkbox" name="documentos[]" value="documento-com-foto" checked>
                    <span>Documento com foto</span>
                </label>
                <label class="">
                    <input type="checkbox" name="documentos[]" value="comprovante-de-residencia" checked>
                    <span>Comprovante de residência</span>
                </label>
                <fieldset id="tipo-arrimo" class="border-1 flex flex-col hidden" name="tipo-arrimo" disabled>
                    <div id="carteira">
                        <p>O alistado está trabalhando de carteira assinada?</p>
                        <label>
                            <input type="radio" name="carteira-trabalho" id="">
                            <span>Sim</span>
                        </label>
                        <label>
                            <input type="radio" name="carteira-trabalho" id="">
                            <span>Não</span>
                        </label>
                    </div>
                    <div id="dependente">
                        <p>Quem vai ser o(a) dependente?</p>
                        <label>
                            <input type="radio" name="tipo-dependente" value="mae">
                            <span>Mãe</span>
                        </label>
                        <label>
                            <input type="radio" name="tipo-dependente" value="filho">
                            <span>Filho(a)</span>
                        </label>
                    </div>
                    <div class="tipo-dependente hidden" name="docs-mae" disabled>
                        <label>
                            <input type="radio" name="tipo-certidao-mae" value="certidao-de-nascimento-da-mae">
                            <span>Certidão de nascimento</span>
                        </label>
                        <label>
                            <input type="radio" name="tipo-certidao-mae" value="certidao-de-casamento-da-mae">
                            <span>Certidão de casamento</span>
                        </label>
                    </div>
                    <div class="tipo-dependente hidden" name="docs-filho" disabled>
                        <label>
                            <input type="checkbox" name="documentos[]" value="certidao-nascimento-filho" checked>
                            <span>Certidão de nascimento</span>
                        </label>
                    </div>
                </fieldset>
                <fieldset id="tipo-isenção-servico" class="border-1 hidden" disabled>
                    <div>
                        <label>
                            <input type="checkbox" name="documentos[]" value="atestado-medico" checked>
                            <span>Atestado médico</span>
                        </label>
                    </div>
                </fieldset>
                <fieldset id="tipo-isenção-txmt" class="border-1 hidden" disabled>
                    <div>
                        <label>
                            <input type="checkbox" name="documentos[]" value="ficha-socioeconomica" checked>
                            <span>Ficha socioeconômica</span>
                        </label>
                    </div>
                    <div>
                        <label>
                            <input type="checkbox" name="documentos[]" value="gru-do-art.-225-do-rlsm" checked>
                            <span>GRU do Art. 225 do RLSM</span>
                        </label>
                    </div>
                </fieldset>
                <fieldset id="tipo-retificacao-dados-cadastrais" class="border-1 hidden" disabled>
                    <div class="tipo-documento-retificacao">
                        <label>
                            <input type="radio" name="tipo-documento-retificacao">
                            <span>Certificado de Dispensa</span>
                        </label>
                        <label>
                            <input type="radio" name="tipo-documento-retificacao">
                            <span>Certificado de Reservista de 1ª ou 2ª Categoria</span>
                        </label>
                        <label>
                            <input type="radio" name="tipo-documento-retificacao">
                            <span>Atestado de Desobrigação</span>
                        </label>
                    </div>
                    <div id="nome">
                        <span>Quem teve o nome mudado?</span>
                        <label>
                            <input type="radio" name="pessoa-mudou-nome" value="alistado">
                            <span>Alistado</span>
                        </label>
                        <label>
                            <input type="radio" name="pessoa-mudou-nome" value="mae">
                            <span>Mãe</span>
                        </label>
                        <label>
                            <input type="radio" name="pessoa-mudou-nome" value="pai">
                            <span>Pai</span>
                        </label>
                    </div>
                    <div class="nome-retificado hidden" disabled>
                        <label>
                            <span>
                                Digite o novo nome 
                                <span id="texto-nome"></span>
                                :
                            </span>
                            <input type="text" class="border-1" id="texto-nome-retificado">
                        </label>
                    </div>
                </fieldset>
            </fieldset>
            <button id="btn" class="bg-blue-700 w-12 hover:bg-blue-900 rounded-lg font-bold py-1 transition text-white cursor-pointer">Botão</button>
        </form>
        <script src="popup.js" defer></script>
    </body>
</html>
